function toast(m){const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2400)}
const status=p=>{let o='';if(p.d<=0)o+='<span class="pill bad">Expired</span>';else if(p.d<=7)o+=`<span class="pill">${p.d}d left</span>`;if(p.q<=LOW)o+='<span class="pill bad">Low stock</span>';return o||'<span class="pill ok">Fresh</span>'};
const T=[['dash','📊','Dashboard'],['inv','📦','Inventory'],['bill','🧾','Billing'],['restock','🚨','Restock'],['alert','🔔','Alerts'],['about','🎓','About']];
function nav(){$('#nav').innerHTML=`<div class="brand"><div class="lg">🥑</div><div><b>Groceria</b><small>Smart grocery management</small></div></div>`+T.map(t=>`<button class="${view==t[0]?'on':''}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('')+`<div class="sp"></div><div class="mini">Catalogue size<b>${N(P.length)}</b>No product limit</div>`;$('#inf').textContent='∞ Unlimited · '+N(P.length)+' products';$('#ttl').textContent=T.find(t=>t[0]==view)[2]}
function go(v){view=v;q='';cat='All';lim=60;$('#main').className='view'+(v=='inv'||v=='bill'||v=='alert'||v=='restock'?' ns':'');nav();({dash,inv,bill,restock:restockView,alert:alerts,about})[v]();if(v=='dash')cu()}
function dash(){
 const low=P.filter(p=>p.q<=LOW),exp=P.filter(p=>p.d<=7),val=P.reduce((s,p)=>s+p.p*p.q,0),top=[...P].sort(SORT.sold).slice(0,6),mx=top[0].s||1;
 const cc={};P.forEach(p=>cc[p.c]=(cc[p.c]||0)+1);const cl=Object.entries(cc).sort((a,b)=>b[1]-a[1]).slice(0,7),cm=cl[0][1];
 const sv=[...sales,rev],sm=Math.max(...sv,1),dn=['Mon','Tue','Wed','Thu','Fri','Sat','Today'],att=[...exp.map(p=>[p,'⏳ '+(p.d<=0?'Expired':p.d+' days left')]),...low.map(p=>[p,'⚠️ '+p.q+' in stock'])].slice(0,40);
 $('#main').innerHTML=`<div class="dash">
 <div class="card kpi hero"><i>💰</i><span>Revenue today</span><b>${inr(rev)}</b><span>${bills} bills issued</span></div>
 <div class="card kpi"><i>📦</i><span>Products</span><b>${N(P.length)}</b><span>Stock value ${inr(val)}</span></div>
 <div class="card kpi"><i>⚠️</i><span>Low stock</span><b>${N(low.length)}</b><span>${LOW} units or fewer</span></div>
 <div class="card kpi"><i>⏳</i><span>Expiring in 7 days</span><b>${N(exp.length)}</b><span>Needs attention</span></div>
 <div class="card pn sp2"><h3>Top selling <span class="tag">Max-heap</span></h3><div class="sc">${top.map(p=>`<div class="bar"><span>${p.e} ${esc(p.n)}</span><div><u style="width:${p.s/mx*100}%"></u></div><em>${N(p.s)}</em></div>`).join('')}</div></div>
 <div class="card pn sp2"><h3>Sales this week <span class="tag">Live today</span></h3><div class="cols">${sv.map((v,i)=>`<div>${i==6?inr(v):''}<u style="height:${v/sm*80}%"></u>${dn[i]}</div>`).join('')}</div></div>
 <div class="card pn sp2"><h3>Products by category <span class="tag">Hash table</span></h3><div class="sc">${cl.map(c=>`<div class="bar"><span>${CAT[c[0]]||'🛍️'} ${esc(c[0])}</span><div><u style="width:${c[1]/cm*100}%"></u></div><em>${N(c[1])}</em></div>`).join('')}</div></div>
 <div class="card pn sp2"><h3>Needs attention <span class="tag">Min-heap</span></h3><div class="sc">${att.length?att.map(a=>`<div class="rg"><b>${a[0].e} ${esc(a[0].n)}</b><span style="color:var(--mut)">${a[1]}</span><span></span></div>`).join(''):'<div class="empty">All clear 🎉</div>'}</div></div></div>`}
function inv(){
 const dl=`<datalist id="dc">${cats().slice(1).map(c=>`<option value="${esc(c)}">`).join('')}</datalist><datalist id="du">${['pc','kg','g','L','ml','pack','doz','bag','btl','box'].map(u=>`<option value="${u}">`).join('')}</datalist>`;
 $('#main').innerHTML=`<div class="split"><div class="card pn"><div class="tools"><input class="s" placeholder="🔎 Find by ID (e.g. 1004) or name prefix…" oninput="q=this.value;lim=60;drawInv()">
 <select onchange="sort=this.value;drawInv()"><option value="name">A–Z (AVL)</option><option value="pa">Price ↑ (merge sort)</option><option value="pd">Price ↓</option><option value="qty">Quantity ↑</option><option value="exp">Expiry soonest</option><option value="sold">Most sold</option></select>
 <button class="btn g" id="ub" onclick="doUndo()">↩ Undo</button></div><div class="chips" id="cc"></div><div class="sc lw" id="list"></div><div style="color:var(--mut);font-size:12px;padding-top:8px" id="cnt"></div></div>
 <div class="card pn"><h3>New product <span class="tag">No limits</span></h3><div class="sc"><div class="f">
 <div class="w"><label>Name</label><input id="an" placeholder="Any name, any length"></div>
 <div><label>Category</label><input id="ac" list="dc" placeholder="Pick or create"></div><div><label>Brand</label><input id="ab"></div>
 <div><label>Price ₹</label><input id="ap" type="number" min="0" step="any"></div><div><label>Quantity</label><input id="aq" type="number" min="0"></div>
 <div><label>Unit</label><input id="au" list="du" placeholder="pc"></div><div><label>Shelf days</label><input id="ad" type="number" min="1" placeholder="blank = none"></div>
 <div><label>Emoji</label><input id="ae" placeholder="🛍️"></div><div class="w"><label>Notes</label><textarea id="ax" rows="2" placeholder="Barcode, supplier, storage…"></textarea></div></div>
 <div class="tools" style="margin:12px 0 0"><button class="btn" onclick="addP()">Add product</button><button class="btn o" onclick="bulk(1000)">＋ 1,000 demo</button></div>${dl}</div></div></div>`;drawInv()}
function drawInv(){
 V=match().sort(SORT[sort]);$('#cc').innerHTML=cats().map(c=>`<button class="${c==cat?'on':''}" onclick="cat=this.dataset.c;lim=60;drawInv()" data-c="${esc(c)}">${esc(c)}</button>`).join('');$('#ub').textContent=`↩ Undo (stack · ${undo.length})`;$('#ub').disabled=!undo.length;
 const L=$('#list');L.onscroll=()=>{if(lim<V.length&&L.scrollTop+L.clientHeight>L.scrollHeight-240){lim+=60;rows()}};L.scrollTop=0;rows();nav()}
function rows(){const L=$('#list');L.innerHTML=V.length?V.slice(0,lim).map(p=>`<div class="row"><div class="ic">${p.e}</div><div><b>${esc(p.n)}</b><small>#${p.id} · ${esc(p.c)}${p.b?' · '+esc(p.b):''}</small></div><div class="hm"><b>${inr(p.p)}</b><small>per ${esc(p.u)}</small></div><div class="hm"><b>${N(p.q)}</b><small>stock</small></div><div class="hm">${status(p)}</div><div style="display:flex;gap:5px"><button class="btn g" onclick="restock(${p.id})">+10</button><button class="btn r" onclick="del(${p.id})">✕</button></div></div>`).join(''):'<div class="empty">No products match.</div>';$('#cnt').textContent=`Showing ${N(Math.min(lim,V.length))} of ${N(V.length)} · scroll for more`}
function addP(){
 const g=i=>$('#'+i).value.trim(),n=g('an'),pr=+g('ap'),qt=+g('aq'),dd=+g('ad');
 if(!n||!(pr>=0)||g('ap')===''||qt<0)return toast('Enter a name and a price.');
 if(P.some(p=>p.n.toLowerCase()==n.toLowerCase()))return toast('That product already exists.');
 const p=mk({n,c:g('ac')||'General',b:g('ab'),p:pr,q:qt||0,u:g('au')||'pc',d:dd>0?dd:NOEXP,x:g('ax'),...(g('ae')?{e:g('ae')}:{})});undo.push({t:'add',ids:[p.id]});toast('Added '+n);go('inv')}
function bulk(k){const A=['Organic','Fresh','Premium','Farm','Classic','Royal','Daily','Golden','Pure','Natural'],I=[['Rice','Grains'],['Lentils','Pulses'],['Oil','Oils'],['Yogurt','Dairy'],['Cookies','Snacks'],['Juice','Beverages'],['Spice Mix','Spices'],['Soap','Household'],['Cereal','Grains'],['Berries','Fruits']],ids=[];
 for(let i=0;i<k;i++){const it=I[Math.floor(Math.random()*I.length)];ids.push(mk({n:`${A[Math.floor(Math.random()*A.length)]} ${it[0]} #${nid}`,c:it[1],p:20+Math.floor(Math.random()*480),q:Math.floor(Math.random()*120),d:Math.random()<.4?1+Math.floor(Math.random()*300):NOEXP,s:Math.floor(Math.random()*40)}).id)}
 undo.push({t:'add',ids});toast('Added '+N(k)+' products. No limit!');go('inv')}
function restock(id){H.get(id).q+=10;undo.push({t:'up',ids:[id]});rows();nav()}
function del(id){const p=H.get(id);P=P.filter(x=>x!==p);H.delete(id);cart.delete(id);undo.push({t:'rm',p});drawInv();toast('Removed '+p.n)}
function doUndo(){const a=undo.pop();if(!a)return;
 if(a.t=='add'){const s=new Set(a.ids);P=P.filter(p=>!s.has(p.id));a.ids.forEach(i=>{H.delete(i);cart.delete(i)})}else if(a.t=='rm'){P.push(a.p);H.set(a.p.id,a.p)}else H.get(a.ids[0]).q-=(a.k||10);
 drawInv();toast('Last change undone')}
function bill(){
 $('#main').innerHTML=`<div class="split" style="grid-template-columns:minmax(0,1fr) 380px"><div class="card pn"><div class="tools"><input class="s" placeholder="🔎 Find an item (prefix search)…" oninput="q=this.value;lim=60;drawGrid()"></div><div class="chips" id="cc"></div><div class="sc lw" id="pg"></div></div>
 <div style="display:flex;flex-direction:column;gap:14px;min-height:0"><div class="card pn"><h3>Counter queue <span class="tag">Queue</span></h3><div id="qu"></div><div class="tools" style="margin:10px 0 0"><input class="s" id="qn" placeholder="Customer name"><button class="btn g" onclick="join()">Join</button><button class="btn" onclick="serve()">Serve next</button></div></div>
 <div class="card pn" style="flex:1"><h3>Cart <span class="tag">Linked list</span></h3><div class="sc" id="ct"></div></div></div></div>`;drawGrid();drawCart();drawQ()}
function drawGrid(){V=match().sort(SORT.name);$('#cc').innerHTML=cats().map(c=>`<button class="${c==cat?'on':''}" onclick="cat=this.dataset.c;lim=60;drawGrid()" data-c="${esc(c)}">${esc(c)}</button>`).join('');
 const L=$('#pg');L.className='sc lw pg';L.onscroll=()=>{if(lim<V.length&&L.scrollTop+L.clientHeight>L.scrollHeight-240){lim+=60;tiles()}};L.scrollTop=0;tiles()}
function tiles(){$('#pg').innerHTML=V.slice(0,lim).map(p=>`<button class="tile" onclick="add(${p.id})"><span class="e">${p.e}</span><b>${esc(p.n)}</b><small>${inr(p.p)} · ${N(p.q)} left</small></button>`).join('')||'<div class="empty">Nothing found.</div>'}
function drawQ(){$('#qu').innerHTML=`<div style="color:var(--mut);font-size:13px">Now serving: <b style="color:var(--ink)">${esc(cur)}</b></div>`+(queue.length?queue.map((n,i)=>`<span class="chip">${i+1}. ${esc(n)}</span>`).join(''):'<div class="empty" style="padding:8px">Queue is empty.</div>')}
function join(){const n=$('#qn').value.trim()||'Customer '+(bills+queue.length+1);queue.push(n);drawQ();toast(n+' joined the queue')}
function serve(){if(!queue.length)return toast('No customers waiting.');cur=queue.shift();drawQ();toast('Serving '+cur)}
function add(id){const p=H.get(id),n=(cart.get(id)||0)+1;if(p.d<=0)return toast('Expired items can’t be sold.');if(n>p.q)return toast('Not enough stock.');cart.set(id,n);drawCart()}
function chg(id,d){const p=H.get(id),n=(cart.get(id)||0)+d;if(n<=0)cart.delete(id);else if(n<=p.q)cart.set(id,n);else toast('Not enough stock.');drawCart()}
function totals(){let s=0;cart.forEach((n,id)=>s+=H.get(id).p*n);const d=s>=2000?s*.1:0,g=(s-d)*.05;return{s,d,g,t:s-d+g}}
function drawCart(){const t=totals();$('#ct').innerHTML=cart.size?[...cart].map(([id,n])=>{const p=H.get(id);return `<div class="cl"><span>${p.e} ${esc(p.n)}<br><small style="color:var(--mut)">${inr(p.p)}</small></span><span class="q"><button onclick="chg(${id},-1)">−</button>${n}<button onclick="chg(${id},1)">+</button></span></div>`}).join('')+`<div class="sum" style="margin-top:8px"><div><span>Subtotal</span><span>${inr(t.s)}</span></div>${t.d?`<div><span>Discount 10%</span><span>−${inr(t.d)}</span></div>`:''}<div><span>GST 5%</span><span>${inr(t.g)}</span></div><div class="t"><span>Total</span><span>${inr(t.t)}</span></div></div><button class="btn" style="width:100%;margin-top:10px" onclick="pay()">Checkout</button>`:'<div class="empty">Tap items to add them.</div>'}
function pay(){const t=totals(),it=[...cart].map(([id,n])=>[H.get(id),n]);cart.forEach((n,id)=>{const p=H.get(id);p.q-=n;p.s+=n});rev+=t.t;bills++;undo=[];cart.clear();receipt(it,t,cur);cur='Walk-in';drawGrid();drawCart();drawQ();nav()}
function alerts(){
 const low=P.filter(p=>p.q<=LOW).sort(SORT.qty),exp=P.filter(p=>p.d<=7).sort(SORT.exp);     // min-heap order
 const L=a=>a.length?a.slice(0,300).map(p=>`<div class="rg" style="grid-template-columns:42px minmax(0,1fr) auto"><div class="ic">${p.e}</div><div><b>${esc(p.n)}</b><small style="color:var(--mut)">${N(p.q)} in stock · ${p.d<=0?'expired':p.d+' days left'}</small></div><div>${status(p)}</div></div>`).join(''):'<div class="empty">All clear 🎉</div>';
 $('#main').innerHTML=`<div class="two" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="card pn"><h3>Expiring soon (${N(exp.length)}) <span class="tag">Min-heap</span></h3><div class="sc lw">${L(exp)}</div></div><div class="card pn"><h3>Low stock (${N(low.length)}) <span class="tag">Threshold scan</span></h3><div class="sc lw">${L(low)}</div></div>${wasteHTML()}</div>`}
function restockView(){
 const Q=P.filter(p=>p.q<=LOW).sort(SORT.qty);   // priority queue: lowest stock = highest priority
 $('#main').innerHTML=`<div class="split"><div class="card pn"><h3>Restocking priority queue (${N(Q.length)}) <span class="tag">Priority queue</span></h3><div class="sc lw">${Q.length?Q.slice(0,300).map((p,i)=>`<div class="rg" style="grid-template-columns:34px 42px minmax(0,1fr) auto"><span class="rk">${i+1}</span><div class="ic">${p.e}</div><div><b>${esc(p.n)}</b><div class="mt"><u style="width:${Math.max(p.q/LOW*100,4)}%"></u></div><small style="color:var(--mut)">${N(p.q)} left · #${p.id}</small></div><button class="btn o" onclick="rstk(${p.id},50)">+50</button></div>`).join(''):'<div class="empty">Every product is well stocked 🎉</div>'}</div></div>
 <div style="display:flex;flex-direction:column;gap:14px;min-height:0"><div class="card"><h3>Restock the most urgent <span class="tag">Pop top-k</span></h3><p style="color:var(--mut);margin:0 0 10px">The lowest stock is served first, like popping the top of the heap.</p><div class="tools" style="margin:0"><button class="btn" onclick="rtop(1)">Top 1</button><button class="btn" onclick="rtop(5)">Top 5</button><button class="btn o" onclick="rtop(99999)">All</button></div></div>
 <div class="card" style="flex:1"><h3>How it works <span class="tag">C++</span></h3><pre>priority_queue&lt;RestockItem&gt; RestockQueue;\nif(p.quantity&lt;=10){\n  RestockQueue.push(\n    {p.id,p.name,p.quantity});\n}</pre></div></div></div>`}
function rstk(id,k){H.get(id).q+=k;undo.push({t:'up',ids:[id],k});toast('Restocked +'+k);restockView();nav()}
function rtop(n){const Q=P.filter(p=>p.q<=LOW).sort(SORT.qty).slice(0,n);if(!Q.length)return toast('Nothing to restock.');Q.forEach(p=>{p.q+=50;undo.push({t:'up',ids:[p.id],k:50})});toast('Restocked '+Q.length+' urgent item(s)');restockView();nav()}
function wasteHTML(){const W=P.filter(p=>p.d>0&&p.d<=7&&p.q>0).sort((a,b)=>b.p*b.q-a.p*a.q).slice(0,300);
 return `<div class="card pn"><h3>Waste prevention (${N(W.length)}) <span class="tag">Value at risk</span></h3><div class="sc lw">${W.length?W.map(p=>`<div class="rg" style="grid-template-columns:42px minmax(0,1fr) auto"><div class="ic">${p.e}</div><div><b>${esc(p.n)}</b><small style="color:var(--mut)">${inr(p.p*p.q)} at risk · ${p.d}d left</small></div>${p.w?'<span class="pill ok">On sale</span>':`<button class="btn o" onclick="clr(${p.id})">−20%</button>`}</div>`).join(''):'<div class="empty">Nothing close to expiry 🎉</div>'}</div></div>`}
function clr(id){const p=H.get(id);p.p=Math.round(p.p*80)/100;p.w=1;toast('Clearance price set for '+p.n);alerts()}
function receipt(it,t,who){$('#md').innerHTML=`<div class="rc"><div style="text-align:center"><div style="font-size:34px">🥑</div><b style="font-size:20px">Groceria · Final Bill</b><div style="color:var(--mut);font-size:12px">${new Date().toLocaleString('en-IN')} · Bill #${bills}</div><div style="margin-top:4px">Customer: <b>${esc(who)}</b></div></div><hr style="border:0;border-top:1px dashed var(--line);margin:12px 0">${it.map(([p,n])=>`<div class="cl"><span>${p.e} ${esc(p.n)}<br><small style="color:var(--mut)">${n} × ${inr(p.p)}</small></span><b>${inr(p.p*n)}</b></div>`).join('')}<div class="sum" style="margin-top:8px"><div><span>Subtotal</span><span>${inr(t.s)}</span></div>${t.d?`<div><span>Discount 10%</span><span>−${inr(t.d)}</span></div>`:''}<div><span>GST 5%</span><span>${inr(t.g)}</span></div><div class="t"><span>Total</span><span>${inr(t.t)}</span></div></div><p style="text-align:center;color:var(--mut);margin:12px 0">Thank you for shopping with Groceria!</p><button class="btn" style="width:100%" onclick="closeR()">Done</button></div>`;$('#md').className='on';boom()}
function closeR(){$('#md').className=''}
function cu(){document.querySelectorAll('.kpi b').forEach(e=>{const t=e.textContent,m=t.startsWith('₹'),v=+t.replace(/[^\d.]/g,'');if(!v)return;const s=performance.now();(function f(n){const k=Math.min((n-s)/800,1),x=v*(1-Math.pow(1-k,3));e.textContent=m?inr(x):N(Math.round(x));if(k<1)requestAnimationFrame(f)})(s)})}
function boom(){for(let i=0;i<36;i++){const s=document.createElement('span');s.className='cf';s.textContent=['🎉','🥑','🍎','✨','🥕','🍋'][i%6];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.6+'s';s.style.fontSize=18+Math.random()*18+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),3300)}}
function about(){const C=[['🧱','Vector','Product inventory',N(P.length)+' products','inv'],['🔗','Linked List','Dynamic shopping cart',cart.size+' in cart','bill'],['↩️','Stack','Undo last delete',undo.length+' undo steps','inv'],['🚶','Queue','Customer billing (FIFO)',queue.length+' waiting','bill'],['🚨','Priority Queue','Restocking priority',P.filter(p=>p.q<=LOW).length+' urgent','restock'],['🔎','Searching','Find product by ID','Try ID 1004','inv'],['↕️','Sorting','Sort products by price','Low to high','inv']];
 $('#main').innerHTML=`<div class="ab"><div class="card hero hero2"><span>Minor project · Data Structures and Algorithms</span><b>Groceria – Smart Grocery Management System</b><span>“Where Data Structures Meet Smart Store Management”</span></div>${C.map(c=>`<div class="card cc" onclick="go('${c[4]}')"><span class="e">${c[0]}</span><b>${c[1]}</b><span style="color:var(--mut)">${c[2]}</span><span class="tag" style="align-self:flex-start;margin-top:auto">${c[3]}</span></div>`).join('')}<div class="card"><h3>Team</h3>${['Ishika','Kampreet Kaur','Karamvir Kaur'].map(n=>`<div style="padding:3px 0"><b>👩‍🎓 ${n}</b></div>`).join('')}<small style="color:var(--mut)">Guided by Mr. Inder Dev Singh, Assistant Professor<br>BTech CSE (C2) · College of Engineering · 2026–2027</small></div></div>`}
go('dash');
</script></body></html>
